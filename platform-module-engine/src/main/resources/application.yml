server:
  port: 8081

spring:
  application:
    name: platform-module-engine
  datasource:
    url: jdbc:postgresql://localhost:5433/platformdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

storage:
  local:
    base-path: uploads
  base-url: http://localhost:8081/files

logging:
  level:
    com.platform: DEBUG